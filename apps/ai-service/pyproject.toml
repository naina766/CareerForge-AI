[project]
name = "careerforge-ai-service"
version = "1.0.0"
description = "AI and LLM Orchestration Microservice for CareerForge AI"
authors = [{ name = "CareerForge Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "numpy>=1.26.4",
    "python-multipart>=0.0.9",
    "pypdf>=4.3.1",
    "pdfplumber>=0.11.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0",
    "ruff>=0.6.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
