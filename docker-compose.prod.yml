services:
  nginx:
    image: nginx:alpine
    container_name: careerforge-nginx-prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - careerforge-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: careerforge-web-prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - careerforge-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: careerforge-api-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000/api/v1}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - RESUME_STORAGE_DIR=${RESUME_STORAGE_DIR:-/app/storage/uploads/resumes}
    volumes:
      - api_resume_prod_data:/app/storage/uploads/resumes
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - careerforge-network

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: careerforge-ai-service-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - PRIMARY_LLM_PROVIDER=${PRIMARY_LLM_PROVIDER:-gemini}
      - FALLBACK_LLM_PROVIDER=${FALLBACK_LLM_PROVIDER:-openrouter}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-liquid/lfm-2.5-2.6b:free}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - FAISS_STORAGE_PATH=${FAISS_STORAGE_PATH:-/app/apps/ai-service/storage/faiss}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-careerforge-ai}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_SAMPLE_RATE=${LANGSMITH_SAMPLE_RATE:-1.0}
    volumes:
      - ai_faiss_prod_data:/app/apps/ai-service/storage/faiss
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - careerforge-network

  resume-worker:
    build:
      context: .
      dockerfile: workers/resume-worker/Dockerfile
    container_name: careerforge-resume-worker-prod
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000/api/v1}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - careerforge-network

  ai-worker:
    build:
      context: .
      dockerfile: workers/ai-worker/Dockerfile
    container_name: careerforge-ai-worker-prod
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000/api/v1}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - careerforge-network

  notification-worker:
    build:
      context: .
      dockerfile: workers/notification-worker/Dockerfile
    container_name: careerforge-notification-worker-prod
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - careerforge-network

  postgres:
    image: postgres:16-alpine
    container_name: careerforge-postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-careerforge}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-careerforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careerforge-network

  redis:
    image: redis:7-alpine
    container_name: careerforge-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careerforge-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: careerforge-kafka-prod
    restart: always
    environment:
      # KRaft cluster configuration (Single-node broker + controller)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node replication factors (appropriate for single-broker deployment)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "4L622nShTUiBenYhPXlu6Q"
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - careerforge-network

volumes:
  postgres_prod_data:
    name: careerforge_postgres_prod_data
  redis_prod_data:
    name: careerforge_redis_prod_data
  kafka_prod_data:
    name: careerforge_kafka_prod_data
  ai_faiss_prod_data:
    name: careerforge_ai_faiss_prod_data
  api_resume_prod_data:
    name: careerforge_api_resume_prod_data

networks:
  careerforge-network:
    driver: bridge
