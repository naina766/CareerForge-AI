name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-lint-test:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Run Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt pytest httpx
          pytest apps/ai-service/tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript Types
        run: pnpm typecheck

      - name: Lint Workspace
        run: pnpm lint

      - name: Validate Prisma Schema
        run: pnpm exec prisma validate

      - name: Push Schema to Test Database
        run: pnpm exec prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerforge?schema=public

      - name: Build All Packages & Applications
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

      - name: Run Integration Tests
        run: |
          pnpm tsx tests/integration/security-resilience.test.ts
          pnpm tsx tests/integration/observability.test.ts
          pnpm tsx tests/integration/production-readiness.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerforge?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_jwt_access_secret_ci_env_32_chars_min
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_env_32_chars_min
