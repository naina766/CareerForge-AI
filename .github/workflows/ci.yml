name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  
  # Job 1: Quality, Lint & Typecheck
  
  quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm --filter @careerforge/config --filter @careerforge/database --filter @careerforge/types build

      - name: Validate TypeScript Types
        run: pnpm typecheck

      - name: Lint Workspace
        run: pnpm lint

      - name: Validate Prisma Schema
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerforge?schema=public

  
  # Job 2: AI Regression & Evaluation Gates (Phase 10 Foundation)
  
  ai-regression:
    name: AI Regression & Evaluation Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt pytest httpx

      - name: Validate AI Evaluation Dataset Integrity
        run: python apps/ai-service/evaluation/validator.py

      - name: Run AI Evaluation & Regression Gates
        run: python apps/ai-service/evaluation/runners.py
        env:
          LANGSMITH_TRACING: 'false'
          ENVIRONMENT: 'test'
          PRIMARY_LLM_PROVIDER: 'mock'
          FALLBACK_LLM_PROVIDER: 'mock'

      - name: Run AI Pytest Test Suite
        run: pytest apps/ai-service/tests
        env:
          LANGSMITH_TRACING: 'false'
          ENVIRONMENT: 'test'

      - name: Upload AI Evaluation Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-reports
          path: apps/ai-service/evaluation/reports/
          retention-days: 14

  
  # Job 3: Integration & Production Readiness Tests
  
  integration-and-readiness:
    name: Integration & Resilience Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3
          CLUSTER_ID: "4L622nShTUiBenYhPXlu6Q"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm --filter @careerforge/config --filter @careerforge/database --filter @careerforge/types build

      - name: Deploy Migrations to Test Database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerforge?schema=public

      - name: Run Integration Tests
        run: |
          pnpm tsx tests/integration/security-resilience.test.ts
          pnpm tsx tests/integration/redis-live-integration.test.ts
          pnpm tsx tests/integration/observability.test.ts
          pnpm tsx tests/integration/production-readiness.test.ts
          pnpm tsx tests/integration/kafka-events.test.ts
          pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerforge?schema=public
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
          JWT_ACCESS_SECRET: test_jwt_access_secret_ci_env_32_chars_min
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_env_32_chars_min
          NODE_ENV: test

  
  # Job 4: Production Application & Package Builds
  
  production-build:
    name: Production Application Builds
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages & Applications
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  
  # Job 5: Production Docker Build Validation (Matrix)
  
  docker-validation:
    name: Docker Build Validation (${{ matrix.service.name }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: ai-service
            dockerfile: apps/ai-service/Dockerfile
          - name: resume-worker
            dockerfile: workers/resume-worker/Dockerfile
          - name: ai-worker
            dockerfile: workers/ai-worker/Dockerfile
          - name: notification-worker
            dockerfile: workers/notification-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Build (${{ matrix.service.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: careerforge/${{ matrix.service.name }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  
  # Job 6: CI Gate Summary & Final Status
  
  ci-status:
    name: CI Pipeline Status Gate
    needs:
      - quality
      - ai-regression
      - integration-and-readiness
      - production-build
      - docker-validation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Pipeline Outcome
        run: |
          echo "              CareerForge AI CI Pipeline Gate               "
          echo "Quality & Static Analysis:  ${{ needs.quality.result }}"
          echo "AI Regression & Gates:      ${{ needs.ai-regression.result }}"
          echo "Integration & Readiness:    ${{ needs.integration-and-readiness.result }}"
          echo "Production Application:     ${{ needs.production-build.result }}"
          echo "Docker Validation:          ${{ needs.docker-validation.result }}"

          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.ai-regression.result }}" != "success" ] || \
             [ "${{ needs.integration-and-readiness.result }}" != "success" ] || \
             [ "${{ needs.production-build.result }}" != "success" ] || \
             [ "${{ needs.docker-validation.result }}" != "success" ]; then
            echo "[FAILED] CI Pipeline Failed. One or more mandatory quality gates regressed."
            exit 1
          fi

          echo "[SUCCESS] All CI Gates Passed Successfully."
